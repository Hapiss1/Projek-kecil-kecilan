<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <rect width="1200" height="800" fill="#080C14"/>
  <rect x="40" y="40" width="1120" height="720" rx="16" fill="#101726" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="40" y="40" width="1120" height="64" rx="16" fill="#162032"/>
  <circle cx="80" cy="72" r="6" fill="#EF4444"/>
  <circle cx="104" cy="72" r="6" fill="#F59E0B"/>
  <circle cx="128" cy="72" r="6" fill="#10B981"/>
  <text x="160" y="77" fill="#94A3B8" font-family="monospace" font-size="14" letter-spacing="1">PYTHON AUTOMATION // ETL PIPELINE &amp; DATA ENGINE</text>
  <rect x="960" y="58" width="160" height="28" rx="6" fill="#0284C7"/>
  <text x="980" y="76" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">PYTHON 3 · FLASK</text>

  <!-- Left: Real-time Terminal Log Output -->
  <rect x="80" y="140" width="560" height="580" rx="12" fill="#05080E" stroke="#1E293B"/>
  <text x="110" y="180" fill="#7DD3FC" font-family="monospace" font-size="13" font-weight="700">PIPELINE EXECUTION LOG // STDOUT</text>
  
  <text x="110" y="225" fill="#10B981" font-family="monospace" font-size="13">[22:14:02.102] INFO  &gt; Ingesting raw dataset: 50.000 records</text>
  <text x="110" y="255" fill="#38BDF8" font-family="monospace" font-size="13">[22:14:02.215] RUN   &gt; Executing vectorized NumPy transformations</text>
  <text x="110" y="285" fill="#94A3B8" font-family="monospace" font-size="13">[22:14:02.430] DB    &gt; Normalizing null values: 0 errors detected</text>
  <text x="110" y="315" fill="#94A3B8" font-family="monospace" font-size="13">[22:14:02.680] CALC  &gt; Running algorithmic classification model</text>
  <text x="110" y="345" fill="#10B981" font-family="monospace" font-size="13">[22:14:02.890] SUCC  &gt; Generation complete: output_report.parquet</text>
  <text x="110" y="375" fill="#7DD3FC" font-family="monospace" font-size="13">[22:14:03.001] DISP  &gt; Dispatched alerts to Telegram &amp; WhatsApp</text>
  
  <rect x="110" y="420" width="500" height="260" rx="8" fill="#0D1322" stroke="#334155"/>
  <text x="135" y="455" fill="#38BDF8" font-family="monospace" font-size="13">import pandas as pd, numpy as np</text>
  <text x="135" y="485" fill="#F8FAFC" font-family="monospace" font-size="13">def process_batch(source_df):</text>
  <text x="165" y="515" fill="#94A3B8" font-family="monospace" font-size="13">  clean_df = source_df.dropna().copy()</text>
  <text x="165" y="545" fill="#7DD3FC" font-family="monospace" font-size="13">  clean_df['anomaly'] = np.where(clean_df['z_score'] &gt; 2.5, 1, 0)</text>
  <text x="165" y="575" fill="#10B981" font-family="monospace" font-size="13">  return clean_df.to_parquet('output.parquet')</text>
  <text x="135" y="605" fill="#38BDF8" font-family="monospace" font-size="13"># Throughput: 15.000 rows/second</text>

  <!-- Right: Metrics & Throughput -->
  <rect x="680" y="140" width="440" height="580" rx="12" fill="#0D1322" stroke="#1E293B"/>
  <text x="710" y="180" fill="#7DD3FC" font-family="monospace" font-size="13" font-weight="700">BENCHMARKS // ZERO CPU BOTTLENECK</text>
  <text x="710" y="215" fill="#F8FAFC" font-family="sans-serif" font-size="20" font-weight="800">High-Efficiency Data Flow</text>

  <rect x="710" y="260" width="380" height="110" rx="8" fill="#162032" stroke="#334155"/>
  <text x="730" y="300" fill="#7DD3FC" font-family="monospace" font-size="32" font-weight="800">15.000/s</text>
  <text x="730" y="330" fill="#94A3B8" font-family="sans-serif" font-size="13">Vectorized rows processed per second</text>

  <rect x="710" y="390" width="380" height="110" rx="8" fill="#162032" stroke="#334155"/>
  <text x="730" y="430" fill="#38BDF8" font-family="monospace" font-size="32" font-weight="800">99.98%</text>
  <text x="730" y="460" fill="#94A3B8" font-family="sans-serif" font-size="13">Automated pipeline reliability uptime</text>

  <rect x="710" y="520" width="380" height="160" rx="8" fill="#162032" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="730" y="560" fill="#10B981" font-family="sans-serif" font-size="16" font-weight="700">Zero Third-Party Dependency</text>
  <text x="730" y="590" fill="#94A3B8" font-family="sans-serif" font-size="13">Built purely on native Python standard libraries and mathematical primitives for minimal footprint.</text>
  <rect x="730" y="620" width="150" height="36" rx="6" fill="#10B981"/>
  <text x="750" y="643" fill="#080C14" font-family="sans-serif" font-size="12" font-weight="800">PRODUCTION READY</text>
</svg>
