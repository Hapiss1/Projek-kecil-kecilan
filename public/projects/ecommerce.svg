<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <rect width="1200" height="800" fill="#080C14"/>
  <rect x="40" y="40" width="1120" height="720" rx="16" fill="#101726" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="40" y="40" width="1120" height="64" rx="16" fill="#162032"/>
  <circle cx="80" cy="72" r="6" fill="#EF4444"/>
  <circle cx="104" cy="72" r="6" fill="#F59E0B"/>
  <circle cx="128" cy="72" r="6" fill="#10B981"/>
  <text x="160" y="77" fill="#94A3B8" font-family="monospace" font-size="14" letter-spacing="1">STOREVIBE // MULTI-CATEGORY COMMODITY ENGINE</text>
  <rect x="980" y="58" width="140" height="28" rx="6" fill="#0284C7"/>
  <text x="1005" y="76" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">LARAVEL 10</text>

  <!-- Content Grid -->
  <!-- Left Column: Catalog Highlights -->
  <rect x="80" y="140" width="480" height="580" rx="12" fill="#0D1322" stroke="#1E293B"/>
  <text x="110" y="180" fill="#7DD3FC" font-family="monospace" font-size="13" font-weight="700">CATALOG TAXONOMY · BOOKS / TECH / SHOES</text>
  <text x="110" y="215" fill="#F8FAFC" font-family="sans-serif" font-size="22" font-weight="800">Dynamic Inventory & Cart Engine</text>
  <text x="110" y="245" fill="#94A3B8" font-family="sans-serif" font-size="14">Normalized MySQL relational schema with real-time stock sync.</text>

  <!-- Product Item Card 1 -->
  <rect x="110" y="280" width="420" height="90" rx="8" fill="#162032" stroke="#334155"/>
  <rect x="125" y="295" width="60" height="60" rx="6" fill="#0284C7" fill-opacity="0.3"/>
  <text x="145" y="332" fill="#7DD3FC" font-family="monospace" font-size="18" font-weight="700">DEV</text>
  <text x="205" y="320" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="700">Clean Architecture Vol. II</text>
  <text x="205" y="342" fill="#38BDF8" font-family="monospace" font-size="14" font-weight="700">Rp 185.000 · Book</text>
  <rect x="440" y="310" width="70" height="30" rx="4" fill="#0369A1"/>
  <text x="455" y="330" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">IN STOCK</text>

  <!-- Product Item Card 2 -->
  <rect x="110" y="390" width="420" height="90" rx="8" fill="#162032" stroke="#334155"/>
  <rect x="125" y="405" width="60" height="60" rx="6" fill="#0284C7" fill-opacity="0.3"/>
  <text x="145" y="442" fill="#7DD3FC" font-family="monospace" font-size="18" font-weight="700">HW</text>
  <text x="205" y="430" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="700">Mechanical Keychron V1</text>
  <text x="205" y="452" fill="#38BDF8" font-family="monospace" font-size="14" font-weight="700">Rp 1.450.000 · Hardware</text>
  <rect x="440" y="420" width="70" height="30" rx="4" fill="#0369A1"/>
  <text x="455" y="440" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">IN STOCK</text>

  <!-- Product Item Card 3 -->
  <rect x="110" y="500" width="420" height="90" rx="8" fill="#162032" stroke="#334155"/>
  <rect x="125" y="515" width="60" height="60" rx="6" fill="#0284C7" fill-opacity="0.3"/>
  <text x="145" y="552" fill="#7DD3FC" font-family="monospace" font-size="18" font-weight="700">SNK</text>
  <text x="205" y="540" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="700">Ultra Boost Runner 2026</text>
  <text x="205" y="562" fill="#38BDF8" font-family="monospace" font-size="14" font-weight="700">Rp 2.100.000 · Footwear</text>
  <rect x="440" y="530" width="70" height="30" rx="4" fill="#0369A1"/>
  <text x="455" y="550" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">IN STOCK</text>

  <!-- Right Column: Architecture & Analytics -->
  <rect x="600" y="140" width="520" height="270" rx="12" fill="#0D1322" stroke="#1E293B"/>
  <text x="630" y="180" fill="#7DD3FC" font-family="monospace" font-size="13" font-weight="700">DATABASE SCHEMATIC // RELATIONAL MAPPING</text>
  <rect x="630" y="205" width="220" height="175" rx="8" fill="#162032" stroke="#334155"/>
  <text x="645" y="235" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="700">TABLE: products</text>
  <text x="645" y="260" fill="#94A3B8" font-family="monospace" font-size="12">+ id: bigint (PK)</text>
  <text x="645" y="285" fill="#94A3B8" font-family="monospace" font-size="12">+ category_id: int (FK)</text>
  <text x="645" y="310" fill="#94A3B8" font-family="monospace" font-size="12">+ stock_qty: integer</text>
  <text x="645" y="335" fill="#94A3B8" font-family="monospace" font-size="12">+ price: decimal(12,2)</text>
  <text x="645" y="360" fill="#10B981" font-family="monospace" font-size="12">+ timestamps()</text>

  <rect x="870" y="205" width="220" height="175" rx="8" fill="#162032" stroke="#334155"/>
  <text x="885" y="235" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="700">TABLE: order_items</text>
  <text x="885" y="260" fill="#94A3B8" font-family="monospace" font-size="12">+ order_id: uuid (FK)</text>
  <text x="885" y="285" fill="#94A3B8" font-family="monospace" font-size="12">+ product_id: bigint</text>
  <text x="885" y="310" fill="#94A3B8" font-family="monospace" font-size="12">+ unit_price: decimal</text>
  <text x="885" y="335" fill="#94A3B8" font-family="monospace" font-size="12">+ subtotal: decimal</text>
  <text x="885" y="360" fill="#10B981" font-family="monospace" font-size="12">+ status: enum</text>

  <!-- Live Checkout Pipeline -->
  <rect x="600" y="435" width="520" height="285" rx="12" fill="#0D1322" stroke="#1E293B"/>
  <text x="630" y="475" fill="#7DD3FC" font-family="monospace" font-size="13" font-weight="700">TRANSACTION PIPELINE // ACID VERIFIED</text>
  <text x="630" y="515" fill="#F8FAFC" font-family="sans-serif" font-size="18" font-weight="700">Integrated Checkout Workflow</text>
  <text x="630" y="545" fill="#94A3B8" font-family="sans-serif" font-size="14">Cart items &gt; Coupon validation &gt; DB transaction commit &gt; Invoice generation.</text>
  
  <rect x="630" y="580" width="460" height="50" rx="8" fill="#162032" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="655" y="611" fill="#38BDF8" font-family="monospace" font-size="14" font-weight="700">DB::transaction(fn() =&gt; Order::processCart($cart));</text>
  
  <rect x="630" y="645" width="140" height="40" rx="6" fill="#10B981"/>
  <text x="655" y="670" fill="#080C14" font-family="sans-serif" font-size="13" font-weight="800">ZERO LATENCY</text>
</svg>

